# This existing Fly app owns fauscrew.iworf.com and its TLS certificate.
# Its infrastructure ID is independent of the public FausCrew brand.
app = "fauscrew-website"
primary_region = "fra"
kill_signal = "SIGQUIT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

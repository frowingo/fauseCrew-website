<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#faf8f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14060c"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="FausCrew ile ev görevlerini paylaş, ev arkadaşlarınla aynı planda buluş ve birlikte eğlen. Ortak yaşam için tek bir uygulama. App Store ve Google Play'de yakında."
    />
    <meta property="og:title" content="FausCrew — Aynı ev. Aynı ekip." />
    <meta
      property="og:description"
      content="Görevleri paylaşın, planları kaçırmayın, birlikte daha çok eğlenin. Evinizin ortak alanı FausCrew."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FausCrew" />
    <meta property="og:url" content="https://fauscrew.iworf.com/" />
    <link rel="canonical" href="https://fauscrew.iworf.com/" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/app-icon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/app-icon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Temayı ilk boyamadan önce uygula; kaydedilmiş seçim yoksa sistemi izle.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("fauscrew-theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>FausCrew — Aynı ev. Aynı ekip.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
